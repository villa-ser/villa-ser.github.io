<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18191A">
    
    <title>Costos Mano de Obra | Villaser</title>
    
    <!-- Iconos y CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../global.css">

    <!-- Script de ejecución inmediata para el tema -->
    <script>
    (function() {
        const temaGuardado = localStorage.getItem('temaVillaser') || 'system';
        const prefiereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
        
        if (temaGuardado === 'light' || (temaGuardado === 'system' && prefiereClaro)) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
</script>

<!-- SDKs de Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<!-- Guardián de Seguridad -->
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB993KWlnMrN5hwRKjL-OmTZ95F7v_FFk0",
        authDomain: "villaser-gestion.firebaseapp.com",
        projectId: "villaser-gestion",
        storageBucket: "villaser-gestion.firebasestorage.app",
        messagingSenderId: "1032102638132",
        appId: "1:1032102638132:web:dd3a89e1c6a67de7d35061"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    firebase.auth().onAuthStateChanged(user => {
        if (!user || !user.emailVerified) {
            window.location.replace('../index.html'); 
        }
    });
</script>
    
</head>
<body>

<div class="layout-wrapper">
    <main class="container">

        <!-- BARRA DE NAVEGACIÓN -->
        <nav class="corp-top-nav">
            <div style="width: 42px;"></div>
            <div class="corp-nav-title">
                <i class="fa-solid fa-hand-holding-dollar corp-accent-color"></i> MANO DE OBRA
            </div>
            <button class="corp-btn-icon danger" onclick="resetForm()" title="Limpiar Búsqueda">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </nav>

        <!-- INDICADOR DE CARGA -->
        <div id="loading" class="corp-card" style="text-align: center; padding: 40px 20px;">
            <i class="fa-solid fa-satellite-dish fa-spin" style="color: var(--ngc-neon); font-size: 2rem; margin-bottom: 15px;"></i>
            <br><span style="color: var(--ngc-text-faded); font-size: 0.9rem; text-transform: uppercase; font-weight: bold;">Sincronizando Precios...</span>
        </div>
        
        <div id="app" class="oculto flex-column gap-15">
            
            <!-- TARJETA DE FILTROS (ACORDEÓN PLEGABLE) -->
            <section class="corp-card gpu-accel" style="padding: 12px;">
                <details id="acordeonFiltros" class="corp-filtros-details" open>
                    <summary class="corp-btn" style="width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--ngc-bg-input); border: 1px solid var(--ngc-privacy-border); color: var(--ngc-text-main); margin-bottom: 0;">
                        <span style="display: flex; align-items: center; gap: 8px;"><i class="fa-solid fa-gear corp-accent-color"></i> Parámetros de Búsqueda</span>
                        <i class="fa-solid fa-chevron-down acc-icon-indicator"></i>
                    </summary>
                    
                    <div style="padding-top: 18px; display: flex; flex-direction: column; gap: 15px;">
                        
                        <div class="row-group">
                            <label>Organización / Fuente (Filtro)</label>
                            <div id="fuente-container" class="fuentes-list-container">
                                <span style="color: var(--ngc-text-faded); font-size: 0.8rem;">Cargando fuentes...</span>
                            </div>
                        </div>
                        
                        <!-- Categoría / Rubro -->
                        <div class="row-group">
                            <label>Categoría / Rubro</label>
                            <details id="detTema" class="corp-custom-select" disabled>
                                <summary id="sumTema" class="corp-input">Aguarde un momento...</summary>
                                <div id="listTema" class="corp-select-list"></div>
                            </details>
                            <input type="hidden" id="selTema" value="">
                        </div>

                        <!-- Concepto Específico -->
                        <div class="row-group" style="margin-bottom: 0;">
                            <label>Concepto Específico</label>
                            <details id="detConcepto" class="corp-custom-select" disabled>
                                <summary id="sumConcepto" class="corp-input">Seleccione categoría primero...</summary>
                                <div id="listConcepto" class="corp-select-list"></div>
                            </details>
                            <input type="hidden" id="selConcepto" value="">
                        </div>

                    </div>
                </details>
            </section>

            <!-- TARJETA DE RESULTADOS -->
            <section id="result-card" class="corp-card gpu-accel oculto">
                <h4 class="corp-card-title" style="justify-content: space-between; align-items: center; border-bottom: 1px solid var(--ngc-privacy-border); padding-bottom: 12px; margin-bottom: 15px;">
                    <span style="display: flex; align-items: center; gap: 8px;"><i class="fa-solid fa-money-bill-wave corp-accent-color"></i> Cotización Estimada</span>
                    <span id="res-codigo" style="font-size: 0.75rem; background: var(--ngc-neon); color: #000; padding: 4px 8px; border-radius: 6px; font-weight: bold;">---</span>
                </h4>

                <div style="text-align: center; padding: 25px 10px; background: rgba(49, 162, 76, 0.1); border: 1px solid rgba(49, 162, 76, 0.3); border-radius: 12px; margin-bottom: 20px;">
                    <span style="display: block; font-size: 0.75rem; color: var(--ngc-text-faded); text-transform: uppercase; margin-bottom: 5px; font-weight: bold;">Monto Base Sugerido (ARS)</span>
                    <div id="res-precio" style="font-size: 2.5rem; font-weight: 900; color: var(--success-green); letter-spacing: 1px;">$ 0</div>
                </div>

                <div class="row-group">
                    <label>Descripción del Trabajo</label>
                    <div id="res-concepto-full" style="background: var(--ngc-bg-input); padding: 12px 15px; border-radius: 8px; border: 1px solid var(--ngc-privacy-border); color: var(--ngc-neon); font-weight: 600; font-size: 0.95rem; line-height: 1.5;">---</div>
                </div>

                <div class="row-group-stretch">
                    <div class="flex-1">
                        <label>Categoría</label>
                        <div id="res-tema" style="background: var(--ngc-bg-input); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--ngc-privacy-border); font-size: 0.85rem; color: var(--ngc-text-main); text-transform: capitalize;">---</div>
                    </div>
                    <div class="flex-1">
                        <label>Fuente Info</label>
                        <div id="res-org" style="background: var(--ngc-bg-input); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--ngc-privacy-border); font-size: 0.85rem; color: var(--ngc-text-main); text-transform: capitalize;">---</div>
                    </div>
                </div>

                <div class="row-group" style="margin-bottom: 0;">
                    <label>Notas Aclaratorias / Condiciones</label>
                    <div id="res-notes-content" style="background: rgba(245, 195, 59, 0.1); padding: 15px; border-radius: 8px; border-left: 4px solid var(--ngc-warning); font-size: 0.85rem; color: var(--ngc-text-main); line-height: 1.6; white-space: pre-wrap;">Sin observaciones.</div>
                </div>
            </section>

        </div>
    </main>
</div>

<nav class="corp-bottom-nav">
    <div class="corp-scroll-container" id="corpFooterMenu"></div>
</nav>

<!-- Librería de Google Charts -->
<script src="https://www.gstatic.com/charts/loader.js"></script>
<!-- Scripts Propios -->
<script src="script.js"></script>
</body>
</html>
