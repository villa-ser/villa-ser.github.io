<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18191A">
    
    <title>Búsqueda Avanzada | Villaser</title>
    
    <!-- Iconos y CSS Global -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../global.css">

    <!-- Script de ejecución inmediata para el tema -->
    <script>
    (function() {
        const temaGuardado = localStorage.getItem('temaVillaser') || 'system';
        const prefiereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
        
        if (temaGuardado === 'light' || (temaGuardado === 'system' && prefiereClaro)) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
    </script>

    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <!-- Guardián de Seguridad -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB993KWlnMrN5hwRKjL-OmTZ95F7v_FFk0",
            authDomain: "villaser-gestion.firebaseapp.com",
            projectId: "villaser-gestion",
            storageBucket: "villaser-gestion.firebasestorage.app",
            messagingSenderId: "1032102638132",
            appId: "1:1032102638132:web:dd3a89e1c6a67de7d35061"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        firebase.auth().onAuthStateChanged(user => {
            if (!user || !user.emailVerified) {
                window.location.replace('../../index.html'); 
            }
        });
    </script>
</head>
<body>

<div class="layout-wrapper">
    <main class="container">

        <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
        <nav class="corp-top-nav">
            <button type="button" class="corp-btn-icon" onclick="window.location.href='../index.html'" title="Volver a Mano de Obra" aria-label="Volver">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="corp-nav-title">
                <i class="fa-solid fa-magnifying-glass-plus corp-accent-color"></i> BÚSQUEDA AVANZADA
            </div>
            <button type="button" class="corp-btn-icon danger" onclick="limpiarBusqueda()" title="Limpiar Búsqueda" aria-label="Limpiar">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </nav>

        <!-- INDICADOR DE CARGA -->
        <div id="loading" class="corp-card" style="text-align: center; padding: 40px 20px;">
            <i class="fa-solid fa-satellite-dish fa-spin" style="color: var(--ngc-neon); font-size: 2rem; margin-bottom: 15px;"></i>
            <br><span style="color: var(--ngc-text-faded); font-size: 0.9rem; text-transform: uppercase; font-weight: bold;">Sincronizando Precios desde la Nube...</span>
        </div>

        <!-- CONTENIDO PRINCIPAL DEL BUSCADOR -->
        <div id="app" class="oculto flex-column gap-15">
            
            <!-- TARJETA DEL BUSCADOR -->
            <section class="corp-card gpu-accel">
                <h4 class="corp-card-title" style="margin-bottom: 15px;">
                    <i class="fa-solid fa-magnifying-glass corp-accent-color"></i> Buscador de Mano de Obra
                </h4>
                
                <div class="row-group" style="margin-bottom: 0;">
                    <label for="searchInput">¿Qué trabajo necesitás cotizar?</label>
                    <div style="display: flex; flex-direction: column; gap: 10px; position: relative;">
                        <input type="text" id="searchInput" class="corp-input" placeholder="Ej: pilar trifásico, tablero, jabalina..." disabled autocomplete="off">
                        
                        <!-- Dropdown de sugerencias -->
                        <ul id="suggestionsList" class="oculto" style="position: absolute; top: 48px; left: 0; right: 0; z-index: 50; list-style: none; margin: 0; padding: 0; background: var(--ngc-bg-card, #242526); border: 1px solid var(--ngc-privacy-border); border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.35); max-height: 240px; overflow-y: auto;"></ul>
                        
                        <button type="button" id="btnBuscar" class="corp-btn corp-btn-large primary-action" style="width: 100%;" disabled>
                            <i class="fa-solid fa-magnifying-glass"></i> Buscar Precio
                        </button>
                    </div>
                </div>

                <!-- Búsquedas rápidas -->
                <div style="margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--ngc-privacy-border);">
                    <span style="font-size: 0.8rem; color: var(--ngc-text-faded); display: block; margin-bottom: 10px; font-weight: 600;">Búsquedas rápidas:</span>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                        <button type="button" class="corp-btn corp-btn-small" style="width: auto;" onclick="busquedaRapida('Apto electrico')">Apto Eléctrico</button>
                        <button type="button" class="corp-btn corp-btn-small" style="width: auto;" onclick="busquedaRapida('Armado de Pilar')">Armado de Pilar</button>
                        <button type="button" class="corp-btn corp-btn-small" style="width: auto;" onclick="busquedaRapida('Tablero')">Tableros</button>
                        <button type="button" class="corp-btn corp-btn-small" style="width: auto;" onclick="busquedaRapida('Toma')">Tomas</button>
                    </div>
                </div>
            </section>

            <!-- CONTENEDOR DE RESULTADOS -->
            <div id="resultsContainer" class="flex-column gap-15"></div>

        </div>
    </main>
</div>
<nav class="corp-bottom-nav">
    <div class="corp-scroll-container" id="corpFooterMenu"></div>
</nav>
<script src="script.js" defer></script>
</body>
  </html>
