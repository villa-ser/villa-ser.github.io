<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Habilita el zoom y redimensionamiento dinámico en móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    
    <title>Visor de Catálogo | Villaser</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- CERO CSS GLOBAL. Estilos estrictos para forzar el ancho total -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* Barra superior */
        .visor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #18191A;
            padding: 10px 15px;
            width: 100%;
            height: 60px; /* Altura fija para el cálculo exacto del iframe */
            flex-shrink: 0;
            z-index: 10;
        }

        .visor-title {
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 65%;
        }

        .btn-volver {
            background: rgba(255, 75, 43, 0.1);
            color: #ff4b2b;
            border: 1px solid #ff4b2b;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        /* Contenedor del PDF forzando márgenes cero absolutos */
        .iframe-container {
            flex: 1;
            width: 100vw;
            height: calc(100vh - 60px);
            position: relative;
            background-color: #ffffff;
            margin: 0 !important;
            padding: 0 !important;
            max-width: none !important;
            overflow: hidden;
        }

        /* El iframe rompe cualquier límite */
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            margin: 0;
            padding: 0;
            position: relative;
            z-index: 2;
        }

        .loader-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00d4ff;
            text-align: center;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR FIJA -->
    <div class="visor-header">
        <span class="visor-title" id="docTitle">
            <i class="fa-solid fa-book-open" style="color: #ff4b2b;"></i> Catálogo
        </span>
        <button onclick="window.location.href='index.html'" class="btn-volver">
            <i class="fa-solid fa-arrow-left"></i> Volver
        </button>
    </div>

    <!-- CONTENEDOR DEL PDF -->
    <div class="iframe-container">
        <div class="loader-center" id="loaderVisor">
            <i class="fa-solid fa-circle-notch fa-spin fa-3x"></i>
            <p style="margin-top: 15px; font-size: 0.9rem; font-weight: bold; color: #333;">Cargando...</p>
        </div>
        <iframe id="pdfFrame" src="" onload="document.getElementById('loaderVisor').style.display='none'"></iframe>
    </div>

    <!-- SCRIPT PARA EXTRAER EL ID DE LA URL Y CARGARLO -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const docId = urlParams.get('id');
            const docTitle = urlParams.get('titulo');

            if(docTitle) {
                document.getElementById('docTitle').innerHTML = `<i class="fa-solid fa-book-open" style="color: #ff4b2b;"></i> ${docTitle}`;
            }

            if(docId) {
                // Al agregar rm=minimal forzamos a la UI de Google a colapsar barras laterales y controles
                document.getElementById('pdfFrame').src = `https://drive.google.com/file/d/${docId}/preview?rm=minimal`;
            } else {
                document.getElementById('loaderVisor').innerHTML = "<p style='color: red;'>Error: No se encontró el documento.</p>";
            }
        });
    </script>
</body>
</html>
