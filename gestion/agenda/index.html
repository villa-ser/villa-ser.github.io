<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18191A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>Villaser - Agenda de Contactos</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../global.css">

    <script>
    (function() {
        const temaGuardado = localStorage.getItem('temaVillaser') || 'system';
        const prefiereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
        if (temaGuardado === 'light' || (temaGuardado === 'system' && prefiereClaro)) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
    </script>

    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Guardián de Seguridad -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB993KWlnMrN5hwRKjL-OmTZ95F7v_FFk0",
            authDomain: "villaser-gestion.firebaseapp.com",
            projectId: "villaser-gestion",
            storageBucket: "villaser-gestion.firebasestorage.app",
            messagingSenderId: "1032102638132",
            appId: "1:1032102638132:web:dd3a89e1c6a67de7d35061"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        let currentUserUid = null;
        firebase.auth().onAuthStateChanged(user => {
            if (!user || !user.emailVerified) {
                window.location.replace('../index.html'); 
            } else {
                currentUserUid = user.uid;
                if(typeof initAgenda === 'function') initAgenda();
            }
        });
    </script>
</head>
<body>

<body>

    <!-- TOAST NOTIFICACIÓN CORPORATIVA -->
    <div id="toastAgenda" class="toast-corp oculto gpu-accel">
        <div class="toast-icon"><i id="toastIcon" class="fa-solid fa-check-circle"></i></div>
        <div class="toast-content">
            <div id="toastTitle" class="toast-title">Acción Exitosa</div>
            <div id="toastMessage" class="toast-msg">El contacto ha sido guardado.</div>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="layout-wrapper">
        <main class="container">
            
            <!-- CABECERA Y NAVEGACIÓN -->
            <nav class="corp-top-nav">
                <div style="width: 42px;"></div>
                <div class="corp-nav-title">
                    <i class="fa-solid fa-address-book corp-accent-color"></i> MI AGENDA
                </div>
                <button class="corp-btn-icon success" onclick="abrirModalFormulario()">
                    <i class="fa-solid fa-user-plus"></i>
                </button>
            </nav>

            <!-- BUSCADOR Y FILTROS -->
            <div class="corp-card" style="margin-bottom: 15px;">
                <div class="row-group">
                    <label><i class="fa-solid fa-magnifying-glass"></i> Buscar Contacto</label>
                    <input type="text" id="buscador" class="corp-input" placeholder="Nombre, dirección o teléfono..." oninput="filtrarContactos()">
                </div>

                <div class="row-group" style="margin-bottom: 0; display: flex; justify-content: flex-end; align-items: center; gap: 8px;">
                     <label style="margin-bottom: 0; white-space: nowrap;"><i class="fa-solid fa-arrow-down-a-z"></i> Ordenar por</label>
                     <select id="ordenador" class="corp-input native-select" onchange="renderizarContactos()" style="width: auto; padding: 6px 30px 6px 12px; font-size: 0.8rem; height: auto;">
                          <option value="recientes">Más recientes primero</option>
                          <option value="antiguos">Más antiguos primero</option>
                          <option value="az">Alfabético (A-Z)</option>
                          <option value="za">Alfabético (Z-A)</option>
                     </select>
                </div>
                
            </div>

            <!-- LISTA DE CONTACTOS -->
            <div id="listaContactos" style="width: 100%;">
                <div id="loaderAgenda" class="corp-card" style="text-align: center; color: var(--ngc-neon);">
                    <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                    <p style="margin-top: 12px; font-size: 0.9rem; font-weight: bold; text-transform: uppercase;">Cargando contactos...</p>
                </div>
            </div>

        </main>
    </div>

    <!-- MODAL FORMULARIO DE CONTACTO -->
    <div id="modalFormulario" class="modal-overlay oculto gpu-accel">
        <div class="corp-modal-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
                <h3 id="formTitle" style="margin: 0; display: flex; align-items: center; gap: 8px;"><i class="fa-solid fa-user-plus corp-accent-color"></i> Nuevo Contacto</h3>
                <button onclick="cerrarModal('modalFormulario')" class="corp-btn-icon" style="margin-top: -5px; margin-right: -5px;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div style="display: flex; flex-direction: column; width: 100%;">
                <input type="hidden" id="contactoId">
                
                <div class="row-group">
                    <label>Nombre / Empresa *</label>
                    <input type="text" id="formNombre" class="corp-input" placeholder="Ej: Familia Gómez">
                </div>
                
                <div class="row-group">
                    <label>Dirección</label>
                    <input type="text" id="formDir" class="corp-input" placeholder="Ej: San Martín 123">
                </div>
                
                <div class="row-group">
                    <label>Teléfono (WhatsApp)</label>
                    <input type="tel" id="formTel" class="corp-input" placeholder="Ej: 3511234567">
                </div>
                
                <div class="row-group">
                    <label>Observaciones</label>
                    <input type="text" id="formObs" class="corp-input" placeholder="Ej: Referenciado por Juan">
                </div>
                
                <button class="corp-btn success-btn" style="width: 100%; margin-top: 10px;" onclick="guardarContacto()">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Contacto
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DETALLES DEL CONTACTO -->
    <div id="modalDetalle" class="modal-overlay oculto gpu-accel">
        <div class="corp-modal-card">
            <div style="display: flex; justify-content: flex-end; margin-bottom: -15px; position: relative; z-index: 2;">
                <button onclick="cerrarModal('modalDetalle')" class="corp-btn-icon"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div style="text-align: center; margin-bottom: 25px;">
                <div style="width: 75px; height: 75px; border-radius: 50%; background: rgba(35, 116, 225, 0.1); border: 2px solid var(--ngc-neon); display: inline-flex; justify-content: center; align-items: center; font-size: 2.2rem; color: var(--ngc-neon); margin-bottom: 12px; box-shadow: 0 0 15px rgba(35, 116, 225, 0.2);">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h3 id="detNombre" style="margin: 0; color: var(--ngc-text-main); font-size: 1.5rem; text-transform: uppercase;">Nombre</h3>
                <p id="detCodigo" style="margin: 5px 0 0 0; font-size: 0.75rem; color: var(--ngc-text-faded); text-transform: uppercase; letter-spacing: 1px;">ID: </p>
            </div>
            
            <div style="background: var(--ngc-bg-input); border: 1px solid var(--ngc-privacy-border); border-radius: 12px; padding: 18px; margin-bottom: 20px; text-align: left;">
                <p style="margin: 0 0 12px 0; font-size: 0.95rem; display: flex; gap: 10px;">
                    <i class="fa-solid fa-location-dot" style="color: var(--ngc-neon); width: 20px; text-align: center; font-size: 1.1rem;"></i> 
                    <span id="detDir" style="color: var(--ngc-text-main);">-</span>
                </p>
                <p style="margin: 0 0 12px 0; font-size: 0.95rem; display: flex; gap: 10px;">
                    <i class="fa-solid fa-phone" style="color: var(--success-green); width: 20px; text-align: center; font-size: 1.1rem;"></i> 
                    <span id="detTel" style="color: var(--ngc-text-main);">-</span>
                </p>
                <p style="margin: 0; font-size: 0.95rem; display: flex; gap: 10px;">
                    <i class="fa-solid fa-comment-dots" style="color: var(--ngc-warning); width: 20px; text-align: center; font-size: 1.1rem;"></i> 
                    <span id="detObs" style="color: var(--ngc-text-main);">-</span>
                </p>
                
                <!-- BORRADORES ACTIVOS (JS inserta el html aquí) -->
                <div id="detHistorial" style="margin-top: 15px; border-top: 1px dashed var(--ngc-privacy-border); padding-top: 15px;">
                </div>
            </div>

            <!-- Botonera Principal -->
            <div class="action-grid-main">
                <button id="btnMap" class="corp-btn primary-action" onclick="abrirMaps()">
                    <i class="fa-solid fa-map-location-dot"></i> Mapa
                </button>
                <button id="btnWts" class="corp-btn success-btn" onclick="abrirWhatsApp()">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                </button>
            </div>
            
            <!-- Botonera Secundaria -->
            <div class="action-grid-main">
                <button class="corp-btn" onclick="abrirModalFormulario(true)">
                    <i class="fa-solid fa-pen"></i> Editar
                </button>
                <button class="corp-btn danger-btn" onclick="eliminarContacto()">
                    <i class="fa-solid fa-trash"></i> Eliminar
                </button>
            </div>
        </div>
    </div>
        
<!-- NUEVO MENÚ INFERIOR TIPO APP -->
<nav class="corp-bottom-nav">
    <div class="corp-scroll-container" id="corpFooterMenu"></div>
</nav>
        
    <!-- Script original -->
    <script src="script.js"></script>
</body>
</html>
