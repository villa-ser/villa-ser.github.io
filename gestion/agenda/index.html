<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18191A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>Villaser - Agenda de Contactos</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../global.css">

    <script>
    (function() {
        const temaGuardado = localStorage.getItem('temaVillaser') || 'system';
        const prefiereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
        if (temaGuardado === 'light' || (temaGuardado === 'system' && prefiereClaro)) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
    </script>

    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Guardián de Seguridad -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB993KWlnMrN5hwRKjL-OmTZ95F7v_FFk0",
            authDomain: "villaser-gestion.firebaseapp.com",
            projectId: "villaser-gestion",
            storageBucket: "villaser-gestion.firebasestorage.app",
            messagingSenderId: "1032102638132",
            appId: "1:1032102638132:web:dd3a89e1c6a67de7d35061"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        let currentUserUid = null;
        firebase.auth().onAuthStateChanged(user => {
            if (!user || !user.emailVerified) {
                window.location.replace('../index.html'); 
            } else {
                currentUserUid = user.uid;
                if(typeof initAgenda === 'function') initAgenda();
            }
        });
    </script>
</head>
<body>

    <body>

    <!-- TOAST NOTIFICACIÓN -->
    <div id="toastAgenda" class="ngc-toast oculto gpu-accel">
        <i id="toastIcon" class="fa-solid fa-check-circle" style="color: var(--success-green); font-size: 1.8rem;"></i>
        <div class="toast-content">
            <strong id="toastTitle">Acción Exitosa</strong>
            <p id="toastMessage">El contacto ha sido guardado.</p>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL (Usa la clase del CSS Raíz) -->
 <div class="layout-wrapper">
    <main class="container">
        
        <!-- CABECERA Y BOTONERA SUPERIOR -->
        <div class="ngc-privacy-card" style="margin-bottom: 15px; text-align: center;">
            <h2 style="margin: 0 0 20px 0; color: var(--ngc-neon); font-size: 1.4rem; text-transform: uppercase; letter-spacing: 1px;">
                <i class="fa-solid fa-address-book"></i> Mi Agenda
            </h2>
            <div class="ngc-button-grid">
                <button class="ngc-btn" onclick="window.location.href='../index.html'">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </button>
                <button class="ngc-btn" onclick="abrirModalFormulario()" style="color: var(--success-green); border-color: rgba(40,167,69,0.3);">
                    <i class="fa-solid fa-user-plus"></i> Nuevo
                </button>
            </div>
        </div>

        <!-- BUSCADOR Y FILTROS -->
        <div class="ngc-privacy-card" style="margin-bottom: 15px;">
            <div class="form-group">
                <label><i class="fa-solid fa-magnifying-glass"></i> Buscar Contacto</label>
                <input type="text" id="buscador" class="ngc-input" placeholder="Nombre, dirección o teléfono..." oninput="filtrarContactos()">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label><i class="fa-solid fa-arrow-down-a-z"></i> Ordenar por</label>
                <select id="ordenador" class="ngc-input" onchange="renderizarContactos()" style="appearance: auto;">
                    <option value="recientes">Más recientes primero</option>
                    <option value="antiguos">Más antiguos primero</option>
                    <option value="az">Alfabético (A-Z)</option>
                    <option value="za">Alfabético (Z-A)</option>
                </select>
            </div>
        </div>

        <!-- LISTA DE CONTACTOS -->
        <div id="listaContactos" style="width: 100%;">
            <div id="loaderAgenda" style="text-align: center; color: var(--ngc-neon); padding: 30px; background: var(--ngc-glass); border-radius: 12px; border: var(--ngc-border-glass);">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                <p style="margin-top: 12px; font-size: 0.9rem; font-weight: bold; text-transform: uppercase;">Cargando contactos...</p>
            </div>
        </div>

    </div>

    <!-- MODAL FORMULARIO -->
    <div id="modalFormulario" class="modal-overlay oculto">
        <div class="ngc-privacy-card gpu-accel" style="max-width: 420px; width: 100%;">
            <div class="modal-header">
                <h3 id="formTitle"><i class="fa-solid fa-user-plus"></i> Nuevo Contacto</h3>
                <button onclick="cerrarModal('modalFormulario')" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div style="display: flex; flex-direction: column; width: 100%;">
                <input type="hidden" id="contactoId">
                
                <div class="form-group">
                    <label>Nombre / Empresa *</label>
                    <input type="text" id="formNombre" class="ngc-input" placeholder="Ej: Familia Gómez">
                </div>
                
                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" id="formDir" class="ngc-input" placeholder="Ej: San Martín 123">
                </div>
                
                <div class="form-group">
                    <label>Teléfono (WhatsApp)</label>
                    <input type="tel" id="formTel" class="ngc-input" placeholder="Ej: 3511234567">
                </div>
                
                <div class="form-group">
                    <label>Observaciones</label>
                    <input type="text" id="formObs" class="ngc-input" placeholder="Ej: Referenciado por Juan">
                </div>
                
                <!-- Botón adaptado a row para el formulario -->
                <button class="ngc-btn" style="width: 100%; color: var(--success-green); border-color: rgba(40,167,69,0.5); flex-direction: row; padding: 15px; margin-top: 5px;" onclick="guardarContacto()">
                    <i class="fa-solid fa-floppy-disk" style="margin: 0; font-size: 1.2rem;"></i> Guardar Contacto
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DETALLES -->
    <div id="modalDetalle" class="modal-overlay oculto">
        <div class="ngc-privacy-card gpu-accel" style="max-width: 420px; width: 100%;">
            <div class="modal-header" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
                <div></div>
                <button onclick="cerrarModal('modalDetalle')" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div style="text-align: center; margin-bottom: 25px;">
                <div style="width: 75px; height: 75px; border-radius: 50%; background: rgba(var(--ngc-neon-rgb), 0.1); border: 2px solid var(--ngc-neon); display: inline-flex; justify-content: center; align-items: center; font-size: 2.2rem; color: var(--ngc-neon); margin-bottom: 12px; box-shadow: 0 0 15px rgba(var(--ngc-neon-rgb), 0.2);">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h3 id="detNombre" style="margin: 0; color: var(--ngc-text-main); font-size: 1.5rem; text-transform: uppercase;">Nombre</h3>
                <p id="detCodigo" style="margin: 5px 0 0 0; font-size: 0.75rem; color: var(--ngc-text-faded); text-transform: uppercase; letter-spacing: 1px;">ID: </p>
            </div>
            
            <div style="background: var(--ngc-bg-input); border: 1px solid var(--ngc-privacy-border); border-radius: 12px; padding: 18px; margin-bottom: 20px; text-align: left;">
                <p style="margin: 0 0 12px 0; font-size: 0.95rem; display: flex; gap: 10px;">
                    <i class="fa-solid fa-location-dot" style="color: var(--ngc-neon); width: 20px; text-align: center; font-size: 1.1rem;"></i> 
                    <span id="detDir" style="color: var(--ngc-text-main);">-</span>
                </p>
                <p style="margin: 0 0 12px 0; font-size: 0.95rem; display: flex; gap: 10px;">
                    <i class="fa-solid fa-phone" style="color: var(--success-green); width: 20px; text-align: center; font-size: 1.1rem;"></i> 
                    <span id="detTel" style="color: var(--ngc-text-main);">-</span>
                </p>
                <p style="margin: 0; font-size: 0.95rem; display: flex; gap: 10px;">
                    <i class="fa-solid fa-comment-dots" style="color: var(--ngc-warning); width: 20px; text-align: center; font-size: 1.1rem;"></i> 
                    <span id="detObs" style="color: var(--ngc-text-main);">-</span>
                </p>
                
                <!-- BORRADORES ACTIVOS (JS inserta el html aquí) -->
                <div id="detHistorial" style="margin-top: 15px; border-top: 1px dashed var(--ngc-privacy-border); padding-top: 15px;">
                </div>
            </div>

            <!-- Botonera Principal -->
            <div class="ngc-button-grid" style="margin-bottom: 12px;">
                <button id="btnMap" class="ngc-btn" style="color: var(--ngc-neon); border-color: rgba(var(--ngc-neon-rgb), 0.3);" onclick="abrirMaps()">
                    <i class="fa-solid fa-map-location-dot"></i> Ir a Mapa
                </button>
                <button id="btnWts" class="ngc-btn" style="color: var(--success-green); border-color: rgba(40,167,69,0.3);" onclick="abrirWhatsApp()">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                </button>
            </div>
            
            <!-- Botonera Secundaria -->
            <div class="ngc-button-grid">
                <button class="corp-btn" onclick="abrirModalFormulario(true)" style="color: var(--ngc-warning); border-style: dashed; border-color: rgba(245, 195, 59, 0.4); background: transparent;">
                    <i class="fa-solid fa-pen"></i> Editar
                </button>
                <button class="corp-btn" onclick="eliminarContacto()" style="color: var(--error-red); border-style: dashed; border-color: rgba(228, 30, 63, 0.4); background: transparent;">
                    <i class="fa-solid fa-trash"></i> Eliminar
                </button>
            </div>
        </div>
    </main>
    </div>
        
<!-- NUEVO MENÚ INFERIOR TIPO APP -->
<nav class="corp-bottom-nav">
    <div class="corp-scroll-container" id="corpFooterMenu"></div>
</nav>
        
    <!-- Script original -->
    <script src="script.js"></script>
</body>
</html>
