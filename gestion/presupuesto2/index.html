<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18191A">
    <title>Presupuesto Corporativo | Villaser</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script>
        (function() {
            const temaGuardado = localStorage.getItem('temaVillaser') || 'system';
            const prefiereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
            if (temaGuardado === 'light' || (temaGuardado === 'system' && prefiereClaro)) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>

<!-- TOAST CORPORATIVO -->
<div id="toastCliente" class="toast-corp oculto">
    <div class="toast-icon"><i class="fa-solid fa-circle-check"></i></div>
    <div class="toast-content">
        <div id="toastTitle" class="toast-title">Éxito</div>
        <div id="toastMessage" class="toast-msg">Acción completada.</div>
    </div>
</div>

<!-- TODOS LOS MODALES ESTANDARIZADOS -->
<div id="modalRecuperarCliente" class="modal-overlay oculto gpu-accel">
    <div class="corp-modal-card">
        <i class="fa-solid fa-rotate-left corp-modal-icon"></i>
        <h3>Borrador Detectado</h3>
        <p>Tienes un presupuesto pendiente. ¿Deseas recuperarlo?</p>
        <div class="corp-modal-actions">
            <button class="corp-btn primary-action" onclick="usarClienteMemoria()">Recuperar Borrador</button>
            <button class="corp-btn danger-btn" onclick="nuevoPresupuesto()">Descartar e Iniciar Nuevo</button>
        </div>
    </div>
</div>

<div id="modalAgendarCliente" class="modal-overlay oculto gpu-accel">
    <div class="corp-modal-card">
        <i class="fa-solid fa-address-book corp-modal-icon"></i>
        <h3>¿Vincular a la Agenda?</h3>
        <p>Si este cliente no está en tu agenda, el presupuesto no se guardará en la nube.</p>
        <div class="corp-modal-actions">
            <button class="corp-btn success-btn" onclick="opcionBuscarAgenda()"><i class="fa-solid fa-search"></i> Buscar en Agenda</button>
            <button class="corp-btn primary-action" onclick="accionAgendarCliente()"><i class="fa-solid fa-user-plus"></i> Agendar Nuevo</button>
            <button class="corp-btn danger-btn" onclick="opcionContinuarSinAgenda()">Continuar sin Nube</button>
        </div>
    </div>
</div>

<div id="modalAgenda" class="modal-overlay oculto gpu-accel">
    <div class="corp-modal-card">
        <h3><i class="fa-solid fa-users"></i> Contactos</h3>
        <input type="text" id="buscadorAgenda" class="corp-input" placeholder="Buscar nombre o dirección..." oninput="filtrarAgenda()" style="margin-bottom: 10px;">
        <div id="listaAgenda" class="modal-list-container"></div>
        <button class="corp-btn" onclick="cerrarModalAgenda()" style="margin-top: 15px;">Cerrar</button>
    </div>
</div>

<div id="modalBorradores" class="modal-overlay oculto gpu-accel">
    <div class="corp-modal-card">
        <h3><i class="fa-solid fa-cloud-arrow-down"></i> Borradores en Nube</h3>
        <div id="listaBorradores" class="modal-list-container"></div>
        <button class="corp-btn" onclick="cerrarModalBorradores()" style="margin-top: 15px;">Cerrar</button>
    </div>
</div>

<!-- CONTENEDOR PRINCIPAL -->
<div class="layout-wrapper">
    <main class="container">
        
        <!-- TOP NAV ALINEADA (Sin botón menú) -->
        <nav class="corp-top-nav">
            <div class="corp-nav-title">
                <i class="fa-solid fa-file-invoice-dollar corp-accent-color"></i> Presupuestos
            </div>
            <button class="corp-btn-icon danger" onclick="nuevoPresupuesto()" title="Nuevo Presupuesto">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </nav>
        
        <div id="loading" class="corp-card" style="text-align: center; margin-top: 20px; color: var(--ngc-neon);">
            <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; margin-bottom: 10px;"></i>
            <p style="font-weight: 600;">Sincronizando Precios...</p>
        </div>

        <div id="app" class="oculto">
            <!-- PASO 1: CLIENTE -->
            <section id="step-cliente" class="corp-card gpu-accel">
                <h4 class="corp-card-title"><i class="fa-solid fa-user-tag"></i> Datos del Proyecto</h4>
                <div class="action-grid-main" style="margin-bottom: 15px;">
                    <button class="corp-btn success-btn" onclick="abrirModalAgenda()"><i class="fa-solid fa-address-book"></i> Agenda</button>
                    <button class="corp-btn primary-action" onclick="abrirModalBorradores()"><i class="fa-solid fa-cloud"></i> Borradores</button>
                </div>
                
                <div class="row-group">
                    <label>Nombre del Cliente</label>
                    <input type="text" id="cliNombre" class="corp-input" placeholder="Ej: Jose Lopez">
                </div>
                <div class="row-group-stretch">
                    <div class="flex-1">
                        <label>Dirección</label>
                        <input type="text" id="cliDireccion" class="corp-input" placeholder="Ej: San Martín 123">
                    </div>
                    <div class="flex-1">
                        <label>Nombre del Proyecto</label>
                        <input type="text" id="cliProyecto" class="corp-input" placeholder="Ej: Remodelación">
                    </div>
                </div>
                
                <button class="corp-btn primary-action" style="margin-top: 10px;" onclick="iniciarPresupuesto()">
                    <i class="fa-solid fa-play"></i> Comenzar Carga de Ítems
                </button>
            </section>
