<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18191A">
    <title>Presupuesto Corporativo | Villaser</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script>
        (function() {
            const temaGuardado = localStorage.getItem('temaVillaser') || 'system';
            const prefiereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
            if (temaGuardado === 'light' || (temaGuardado === 'system' && prefiereClaro)) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>

<!-- MODAL MEMORIA CLIENTE (Estilo Corporativo) -->
<div id="modalRecuperarCliente" class="modal-overlay oculto gpu-accel">
    <div class="corp-modal-card">
        <i class="fa-solid fa-user-check corp-modal-icon"></i>
        <h3>Cliente Detectado</h3>
        <p>Hay datos de un cliente cargado recientemente. ¿Deseas utilizarlos para este presupuesto?</p>
        <div class="corp-modal-actions">
            <button class="corp-btn" onclick="usarClienteMemoria()"><i class="fa-solid fa-check"></i> Usar Datos</button>
            <button class="corp-btn danger-btn" onclick="limpiarClienteMemoria()"><i class="fa-solid fa-rotate-right"></i> Empezar de Cero</button>
        </div>
    </div>
</div>

<div class="layout-wrapper">
    <main class="container">
        
        <!-- BARRA SUPERIOR: Sin menú, título alineado con botón rojo -->
        <nav class="top-nav corp-top-nav">
            <div class="corp-nav-title">
                <i class="fa-solid fa-file-invoice-dollar corp-accent-color"></i> Presupuestos
            </div>
            <button class="corp-btn-icon danger" onclick="nuevoPresupuesto()" title="Nuevo Presupuesto">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </nav>
        
        <div id="app">
            <!-- DATOS DEL PROYECTO -->
            <section id="step-cliente" class="corp-card gpu-accel">
                <h4 class="corp-card-title"><i class="fa-solid fa-user-tag"></i> Datos del Proyecto</h4>
                <p class="corp-subtext">Tus datos de profesional se añadirán al PDF.</p>
                
                <div class="row-group">
                    <label>Nombre del Cliente</label>
                    <input type="text" id="cliNombre" class="corp-input" placeholder="Ej: Jose Lopez" onchange="guardarClienteGlobal()">
                </div>
                
                <div class="row-group-stretch">
                    <div class="flex-1">
                        <label>Dirección</label>
                        <input type="text" id="cliDir" class="corp-input" placeholder="Ej: San Martín 123" onchange="guardarClienteGlobal()">
                    </div>
                    <div class="flex-1">
                        <label>Nombre del Proyecto</label>
                        <input type="text" id="cliObs" class="corp-input" placeholder="Ej: Remodelación" onchange="guardarClienteGlobal()">
                    </div>
                </div>
                
                <button class="corp-btn primary-action" onclick="mostrarSeccionItems()">
                    <i class="fa-solid fa-play"></i> Comenzar Carga de Ítems
                </button>
            </section>
                        <!-- SECCIÓN DE ÍTEMS -->
            <section id="step-trabajo" class="oculto flex-column gap-15">
                <div class="corp-card gpu-accel">
                    <h4 class="corp-card-title"><i class="fa-solid fa-list-check"></i> Agregar Trabajos</h4>
                    
                    <div class="row-group">
                        <label>Rubro</label>
                        <select id="selRubro" class="corp-input native-select">
                            <option value="">-- SELECCIONE RUBRO --</option>
                            <option value="Acometida">Acometida (amurado + conexión)</option>
                            <option value="Cableado">Cableado (AAIERIC)</option>
                            <option value="Canalizacion">Canalización Embutido</option>
                        </select>
                    </div>
                    
                    <div class="row-group">
                        <label>Trabajo</label>
                        <select id="selTrabajo" class="corp-input native-select">
                            <option value="">-- SELECCIONE TRABAJO --</option>
                            <option value="Instalacion Base">Instalación Base</option>
                            <option value="Armado Tablero">Armado de Tablero</option>
                        </select>
                    </div>
                    
                    <div class="row-group-stretch">
                        <div class="flex-1">
                            <label>Cantidad</label>
                            <div class="corp-stepper">
                                <button class="btn-step" onclick="cambiarCant(-1)">-</button>
                                <input type="number" id="itemCant" class="corp-input-step" value="1" min="1">
                                <button class="btn-step" onclick="cambiarCant(1)">+</button>
                            </div>
                        </div>
                        <div class="flex-1">
                            <label>Desc %</label>
                            <div class="corp-stepper">
                                <button class="btn-step" onclick="cambiarDesc(-5)">-</button>
                                <input type="number" id="itemDesc" class="corp-input-step" value="0" min="0" max="100">
                                <button class="btn-step" onclick="cambiarDesc(5)">+</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row-group">
                        <label>Notas del Ítem</label>
                        <textarea id="itemNotas" class="corp-input" rows="2" placeholder="Notas aclaratorias..."></textarea>
                    </div>
                    
                    <button class="corp-btn success-btn" onclick="agregarItem()">
                        <i class="fa-solid fa-plus"></i> Agregar
                    </button>
                </div>

                <!-- NOTAS GLOBALES -->
                <div class="corp-card gpu-accel">
                    <label>Notas Globales del Presupuesto</label>
                    <textarea id="notasGlobales" class="corp-input" rows="3" placeholder="Ej: Válido por 10 días..."></textarea>
                </div>

                <!-- ACCIONES FINALES -->
                <div class="action-grid-main">
                    <button class="corp-btn danger-btn" onclick="generarPDF()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
                    <button class="corp-btn" onclick="tomarCaptura()"><i class="fa-solid fa-image"></i> Captura</button>
                </div>
            </section>
        </div>
        
        <!-- ESPACIO PARA EL MENÚ INFERIOR -->
        <div style="height: 20px;"></div>
    </main>

    <!-- VISTA A4 (Solo PC) -->
    <aside class="preview-panel">
        <div id="plantilla-pdf">
            <div class="pdf-container">
                <header class="pdf-header">
                    <h2>PRESUPUESTO</h2>
                    <p>Cliente: <span id="pdf-cliente-print"></span></p>
                </header>
                <!-- Aquí va tu tabla de PDF estándar -->
            </div>
        </div>
    </aside>
</div>

<!-- NUEVO MENÚ INFERIOR TIPO APP (SCROLL HORIZONTAL) -->
<nav class="corp-bottom-nav">
    <div class="corp-scroll-container" id="corpFooterMenu"></div>
</nav>

<script src="script.js"></script>
</body>
</html>
