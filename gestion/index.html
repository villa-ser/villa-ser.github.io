<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Metas para WebApp -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="manifest.json">
    
    <title>Gestión Interna | Villaser</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        (function() {
            const temaGuardado = localStorage.getItem('temaVillaser');
            const prefiereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
            if (temaGuardado === 'light' || (!temaGuardado && prefiereClaro)) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>

    <!-- PANTALLA DE CARGA -->
    <div id="customSplashScreen" class="splash-screen gpu-accel">
        <img src="./icono2.png" alt="Cargando Villaser..." class="splash-logo">
    </div>

    <!-- MENÚ DE USUARIO FLOTANTE (Solo visible con sesión iniciada) -->
    <div class="hero-logo-icon gpu-accel" aria-label="Menu de Usuario" id="userMenuWrapper" style="display: none;" onclick="toggleUserMenu()">
        <i class="fa-solid fa-user-tie"></i>
        
        <div id="userDropdown" class="dropdown-flotante-content oculto">
            <p id="userEmailDisplay" class="dropdown-email"></p>
            <a href="#" id="btn-instalar" class="oculto"><i class="fa-solid fa-download"></i> Instalar App</a>
            <a href="#" onclick="abrirConfiguracion(); return false;"><i class="fa-solid fa-gear"></i> Configuración</a>
            <a href="#" onclick="cerrarSesion(); return false;"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</a>
        </div>
    </div>

    <main class="ngc-wrapper">
        
        <!-- CABECERA -->
        <div class="gnc-hero-card gpu-accel" id="mainHeader">
            <p class="ngc-title">Plataforma Oficial</p>
            <h1 class="hero-name">Villaser Gestión</h1>
            <div class="ngc-footer-badge">
                <i class="fa-solid fa-circle pulse-icon"></i> Sistema Activo
            </div>
        </div>

        <!-- PANTALLA DE LOGIN (Centrada y Proporcional) -->
        <div id="loginScreen" class="ngc-privacy-card gpu-accel login-box">
            <h2 class="privacy-title">Acceso al Sistema</h2>
            
            <div class="form-group">
                <input type="email" id="emailInput" class="ngc-input" placeholder="Correo electrónico" autocomplete="email">
            </div>
            
            <div class="form-group input-icon-wrapper">
                <input type="password" id="passwordInput" class="ngc-input" placeholder="Contraseña">
                <i class="fa-solid fa-eye input-icon" id="togglePasswordIcon" onclick="togglePasswordVisibility()"></i>
            </div>
            
            <button id="loginBtn" class="ngc-btn primary-btn" onclick="iniciarSesion()">
                <i class="fa-solid fa-lock-open"></i> Ingresar
            </button>
            
            <button id="registerBtn" class="ngc-btn secondary-btn" onclick="crearCuenta()">
                <i class="fa-solid fa-user-plus"></i> Crear Cuenta
            </button>
            
            <p id="errorMessage" class="error-text oculto">
                <i id="errorIcon" class="fa-solid fa-circle-exclamation"></i> <span id="errorTextContent"></span>
            </p>

            <a href="#" class="forgot-link" onclick="recuperarPassword(); return false;">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- INTERFAZ PRINCIPAL DE LA APP (Grilla 3 Columnas) -->
        <div id="appScreen" class="oculto app-container">
            <div id="menuGrid" class="ngc-button-grid">
                <button class="ngc-btn btn-module" id="btnPresupuesto"><i class="fa-solid fa-file-invoice-dollar"></i> Presupuesto</button>
                <button class="ngc-btn btn-module" id="btnMateriales"><i class="fa-solid fa-boxes-stacked"></i> Materiales</button>
                <button class="ngc-btn btn-module" id="btnCostos"><i class="fa-solid fa-hand-holding-dollar"></i> Mano de Obra</button>
                
                <button class="ngc-btn btn-module" id="btnVerClientes"><i class="fa-solid fa-users-viewfinder"></i> Ver Clientes</button>
                <button class="ngc-btn btn-module" id="btnNuevoCliente"><i class="fa-solid fa-user-plus"></i> Nuevo Cliente</button>
                <button class="ngc-btn btn-module"><i class="fa-brands fa-whatsapp"></i> Enviar WTS</button>
                
                <button class="ngc-btn btn-module" id="btnCatalogos"><i class="fa-solid fa-book-open"></i> Catálogos</button>
                <button class="ngc-btn btn-module" id="btnFotos"><i class="fa-solid fa-camera"></i> Fotos</button>
                <button class="ngc-btn btn-module" id="btnInformeTecnico"><i class="fa-solid fa-clipboard-check"></i> Informe Téc.</button>
                
                <button class="ngc-btn btn-module" id="btnPresupuestoPC"><i class="fa-solid fa-desktop"></i> Ppto. PC</button>
                <button class="ngc-btn btn-module" id="btnMaterialesPC"><i class="fa-solid fa-microchip"></i> Mat. PC</button>
                <button class="ngc-btn btn-module" id="btnPotenciaPC"><i class="fa-solid fa-bolt"></i> Potencia PC</button>
                
                <button class="ngc-btn btn-module" id="btnPresupuestoPC2"><i class="fa-solid fa-file-invoice"></i> Ppto. PC 2</button>
                <button class="ngc-btn btn-module" id="btnPreguntas"><i class="fa-solid fa-circle-question"></i> Preguntas</button>
                <button class="ngc-btn btn-module" id="btnProveedores"><i class="fa-solid fa-truck-fast"></i> Proveedores</button>
                
                <button class="ngc-btn btn-module btn-full-width dashed-border"><i class="fa-solid fa-plus"></i> Nuevo Módulo</button>
            </div>
        </div>

        <!-- CRÉDITOS -->
        <div class="ngc-site-credits">
            &copy; 2026 Villaser. Diseñado por <span>Sergio Villagra</span>.
        </div>

    </main>

    <!-- MODAL DE CONFIGURACIÓN DE PERFIL -->
    <div id="modalConfig" class="modal-overlay oculto">
        <div class="ngc-privacy-card modal-content gpu-accel">
            <button onclick="cerrarConfiguracion()" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            
            <h3 class="modal-title"><i class="fa-solid fa-id-card"></i> Configuración</h3>
            
            <div class="modal-body">
                <!-- NUEVO SWITCH DE TEMA PROFESIONAL -->
                <div class="config-row-switch">
                    <label class="config-label"><i class="fa-solid fa-circle-half-stroke"></i> Aspecto Claro</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="checkboxTema" onchange="cambiarTemaDesdeConfig()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <label class="config-label"><i class="fa-solid fa-file-invoice"></i> Datos para PDFs</label>
                <input type="text" id="confNombre" class="ngc-input" placeholder="Nombre (Ej: Sergio Villagra)">
                <input type="text" id="confSlogan" class="ngc-input" placeholder="Slogan (Ej: Electricista Cat. III)">
                <input type="text" id="confTelefono" class="ngc-input" placeholder="Teléfono de contacto">
                
                <label class="config-label upload-label">Logo de la empresa (Máx 500KB)</label>
                <input type="file" id="confLogo" class="ngc-input file-input" accept="image/*">
                <img id="logoPreview" src="" class="logo-preview oculto">
                
                <button class="ngc-btn primary-btn mt-10" onclick="guardarConfiguracion()">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
