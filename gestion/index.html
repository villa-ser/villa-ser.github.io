<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Metas para WebApp -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="manifest.json">
    
    <title>Gestión Interna | Villaser</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        (function() {
            const temaGuardado = localStorage.getItem('temaVillaser');
            const prefiereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
            if (temaGuardado === 'light' || (!temaGuardado && prefiereClaro)) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>

    <!-- PANTALLA DE CARGA -->
    <div id="customSplashScreen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; z-index: 999999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease;">
        <img src="./ico512.png" alt="Cargando Villaser..." style="width: 160px; height: auto; animation: pulse 2s infinite;">
    </div>

    <!-- CONTROLES FLOTANTES (Menú Usuario Sólido) -->
    <div class="hero-logo-icon" aria-label="Menu de Usuario" id="userMenuWrapper" style="display: none; cursor: pointer;" onclick="toggleUserMenu()">
        <i class="fa-solid fa-user-tie" style="font-size: 1.8rem; color: var(--ngc-neon); display: flex; align-items: center; justify-content: center; height: 100%;"></i>
        
        <div id="userDropdown" class="dropdown-flotante-content oculto" style="top: 70px; right: 0; left: auto; width: 180px; position: absolute;">
            <p id="userEmailDisplay" style="color: var(--ngc-text-faded); font-size: 0.7rem; padding: 5px 10px; margin: 0; text-align: center; word-break: break-all; border-bottom: 1px solid var(--ngc-privacy-border);"></p>
            
            <a href="#" id="btn-instalar" class="oculto"><i class="fa-solid fa-download"></i> Instalar App</a>
            <a href="#" onclick="abrirConfiguracion(); return false;"><i class="fa-solid fa-gear"></i> Configuración</a>
            <a href="#" onclick="cerrarSesion(); return false;"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</a>
        </div>
    </div>

    <main class="ngc-wrapper">
        
        <!-- CABECERA -->
        <div class="gnc-hero-card gpu-accel" id="mainHeader" style="margin-top: 5px;">
            <p class="ngc-title" style="margin-bottom: 5px; color: var(--ngc-text-faded);">Plataforma Oficial</p>
            <h1 class="hero-name" style="color: var(--ngc-neon); text-transform: uppercase; font-size: 2.2rem; margin-bottom: 10px;">Villaser Gestión</h1>
            
            <div class="ngc-footer-badge" style="margin-bottom: 0;">
                <i class="fa-solid fa-circle" style="color: var(--success-green); font-size: 0.6rem; margin-right: 5px; animation: pulse 2s infinite;"></i> 
                Sistema Activo
            </div>
        </div>

        <!-- PANTALLA DE LOGIN -->
        <div id="loginScreen" class="ngc-privacy-card gpu-accel" style="margin-top: 10px; border-left: 4px solid var(--ngc-neon);">
            <h2 class="privacy-title" style="margin-bottom: 15px; font-size: 1.2rem;">Acceso al Sistema</h2>
            
            <div class="form-group">
                <input type="email" id="emailInput" class="ngc-input" placeholder="Correo electrónico" autocomplete="email">
            </div>
            
            <div class="form-group" style="margin-top: 15px; position: relative;">
                <input type="password" id="passwordInput" class="ngc-input" placeholder="Contraseña" style="padding-right: 45px;">
                <i class="fa-solid fa-eye" id="togglePasswordIcon" onclick="togglePasswordVisibility()" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--ngc-text-faded); cursor: pointer; font-size: 1.2rem; transition: color 0.3s;"></i>
            </div>
            
            <button id="loginBtn" class="ngc-btn" style="width: 100%; margin-top: 15px;" onclick="iniciarSesion()">
                <i class="fa-solid fa-lock-open"></i> Ingresar
            </button>
            
            <button id="registerBtn" class="ngc-btn" style="width: 100%; margin-top: 10px; background: transparent; border: 1px dashed var(--ngc-neon); box-shadow: none;" onclick="crearCuenta()">
                <i class="fa-solid fa-user-plus"></i> Crear Cuenta
            </button>
            
            <p id="errorMessage" class="error-text oculto" style="margin-top: 10px; font-size: 0.85rem; font-weight: bold; text-align: center;">
                <i id="errorIcon" class="fa-solid fa-circle-exclamation"></i> <span id="errorTextContent"></span>
            </p>

            <div style="margin-top: 15px; font-size: 0.8rem; text-align: center;">
                <a href="#" onclick="recuperarPassword(); return false;" style="color: var(--ngc-neon); text-decoration: none;">¿Olvidaste tu contraseña?</a>
            </div>
        </div>

        <!-- INTERFAZ PRINCIPAL DE LA APP -->
        <div id="appScreen" class="oculto" style="width: 100%;">
            
            <!-- GRILLA DE MÓDULOS -->
            <div id="menuGrid" class="ngc-button-grid" style="margin-top: 10px;">
                <button class="ngc-btn btn-module" id="btnPresupuesto"><i class="fa-solid fa-file-invoice-dollar"></i> Presupuesto</button>
                <button class="ngc-btn btn-module" id="btnMateriales"><i class="fa-solid fa-boxes-stacked"></i> Materiales</button>
                <button class="ngc-btn btn-module" id="btnVerClientes"><i class="fa-solid fa-users-viewfinder"></i> Ver Clientes</button>
                <button class="ngc-btn btn-module" id="btnNuevoCliente"><i class="fa-solid fa-user-plus"></i> Nuevo Cliente</button>
                <button class="ngc-btn btn-module" id="btnCatalogos"><i class="fa-solid fa-book-open"></i> Catálogos</button>
                <button class="ngc-btn btn-module" id="btnFotos"><i class="fa-solid fa-camera"></i> Fotos</button>
                <button class="ngc-btn btn-module"><i class="fa-brands fa-whatsapp"></i> Compartir WTS</button>
                <button class="ngc-btn btn-module" id="btnCostos"><i class="fa-solid fa-hand-holding-dollar"></i> Mano de Obra</button>
                <button class="ngc-btn btn-module" id="btnInformeTecnico"><i class="fa-solid fa-clipboard-check"></i> Informe Técnico</button>
                <button class="ngc-btn btn-module" id="btnPresupuestoPC"><i class="fa-solid fa-desktop"></i> Ppto. PC</button>
                <button class="ngc-btn btn-module" id="btnMaterialesPC"><i class="fa-solid fa-microchip"></i> Materiales PC</button>
                <button class="ngc-btn btn-module" id="btnPotenciaPC"><i class="fa-solid fa-bolt"></i> Potencia PC</button>
                <button class="ngc-btn btn-module" id="btnPresupuestoPC2"><i class="fa-solid fa-file-invoice"></i> Ppto. PC 2</button>
                <button class="ngc-btn btn-module" id="btnPreguntas"><i class="fa-solid fa-circle-question"></i> Preguntas</button>
                <button class="ngc-btn btn-module" id="btnProveedores"><i class="fa-solid fa-truck-fast"></i> Proveedores</button>
                <button class="ngc-btn btn-module" style="border-style: dashed;"><i class="fa-solid fa-plus"></i> Nuevo Módulo</button>
            </div>
        </div>

        <!-- MODAL DE CONFIGURACIÓN DE PERFIL -->
        <div id="modalConfig" class="oculto" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--ngc-glass); backdrop-filter: blur(8px); z-index: 10000; display: flex; justify-content: center; align-items: center;">
            <div class="ngc-privacy-card gpu-accel" style="width: 90%; max-width: 400px; position: relative;">
                <button onclick="cerrarConfiguracion()" style="position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: var(--ngc-text-main); font-size: 1.2rem; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
                
                <h3 style="margin-top: 0; color: var(--ngc-neon); text-transform: uppercase; font-size: 1.1rem; text-align: center;"><i class="fa-solid fa-id-card"></i> Configuración</h3>
                
                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                    
                    <label style="font-size: 0.8rem; color: var(--ngc-text-faded); text-align: left;"><i class="fa-solid fa-circle-half-stroke"></i> Aspecto Visual</label>
                    <div class="theme-switch-wrapper">
                        <input type="radio" id="tema_dark" name="tema_app" value="dark" onchange="cambiarTemaManual('dark')" style="display:none">
                        <label for="tema_dark" class="theme-switch-label">OSCURO</label>
                        <input type="radio" id="tema_light" name="tema_app" value="light" onchange="cambiarTemaManual('light')" style="display:none">
                        <label for="tema_light" class="theme-switch-label">CLARO</label>
                    </div>

                    <label style="font-size: 0.8rem; color: var(--ngc-text-faded); text-align: left;"><i class="fa-solid fa-file-invoice"></i> Datos para PDFs</label>
                    <input type="text" id="confNombre" class="ngc-input" placeholder="Nombre (Ej: Sergio Villagra)">
                    <input type="text" id="confSlogan" class="ngc-input" placeholder="Slogan (Ej: Electricista Cat. III)">
                    <input type="text" id="confTelefono" class="ngc-input" placeholder="Teléfono de contacto">
                    
                    <label style="font-size: 0.8rem; color: var(--ngc-text-faded); text-align: left; margin-top: 5px;">Logo de la empresa (Máx 500KB)</label>
                    <input type="file" id="confLogo" class="ngc-input" accept="image/*" style="padding: 10px;">
                    <img id="logoPreview" src="" style="max-height: 80px; object-fit: contain; margin: 5px auto; display: none;">
                    
                    <button class="ngc-btn" style="margin-top: 10px;" onclick="guardarConfiguracion()">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
                    </button>
                </div>
            </div>
        </div>

        <!-- CRÉDITOS -->
        <div class="ngc-site-credits" style="text-align: center; font-size: 0.65rem; color: var(--ngc-text-faded); margin-top: 10px; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1.5px;">
            &copy; 2026 Villaser. Diseñado por <span style="color: rgba(var(--ngc-neon-rgb), 0.8); font-weight: 700;">Sergio Villagra</span>.
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
