<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18191A">
    
    <title>Proveedores | Villaser</title>
    
    <!-- Iconos y CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../global.css">

    <!-- Script de ejecución inmediata para el tema -->
    <script>
    (function() {
        const temaGuardado = localStorage.getItem('temaVillaser') || 'system';
        const prefiereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
        if (temaGuardado === 'light' || (temaGuardado === 'system' && prefiereClaro)) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
    </script>
</head>
<body>
    <div class="layout-wrapper">
        <main class="container">
            
            <!-- BARRA DE NAVEGACIÓN -->
            <nav class="corp-top-nav">
                <div class="corp-nav-title">
                    <i class="fa-solid fa-store corp-accent-color"></i> Proveedores
                </div>
                <div style="width: 42px;"></div> <!-- Espaciador -->
            </nav>

            <!-- INDICADOR DE CARGA ESTANDARIZADO -->
            <div id="loading" aria-live="polite" class="corp-card" style="text-align: center; padding: 40px 20px;">
                <i class="fa-solid fa-satellite-dish fa-spin" style="color: var(--ngc-neon); font-size: 2rem; margin-bottom: 15px;"></i>
                <br><span style="color: var(--ngc-text-faded); font-size: 0.9rem; text-transform: uppercase; font-weight: bold;">Sincronizando Proveedores...</span>
            </div>
            
            <div id="app" style="display:none;">
                
                <!-- BUSCADOR UNIVERSAL -->
                <section class="corp-card" style="position: sticky; top: 10px; z-index: 10;">
                    <h4 class="corp-card-title"><i class="fa-solid fa-magnifying-glass corp-accent-color"></i> Buscador de Casas de Electricidad</h4>
                    
                    <div class="row-group" style="margin-bottom: 15px;">
                        <label for="searchInput">Escribí Barrio, Calle o Nombre</label>
                        <input type="text" id="searchInput" class="corp-input" placeholder="Ej: General Paz, San Martín, o Electro..." onkeyup="filtrarCasas()" autocomplete="off">
                    </div>
                    
                    <!-- Botón para ver listado completo -->
                    <button id="btnVerTodos" class="corp-btn" style="color: var(--ngc-warning); background: rgba(245, 195, 59, 0.1);" onclick="mostrarListadoAgrupado()">
                        <i class="fa-solid fa-list"></i> Ver Listado Completo por Barrios
                    </button>
                </section>

                <!-- CONTENEDOR DE RESULTADOS -->
                <section id="resultadosContainer" style="display: none; flex-direction: column; gap: 15px; margin-top: 15px;">
                </section>

            </div>
        </main>
    </div>

    <!-- MENÚ INFERIOR TIPO APP -->
    <nav class="corp-bottom-nav">
        <div class="corp-scroll-container" id="corpFooterMenu"></div>
    </nav>
    
    <!-- ================================================== -->
    <!-- MODAL VISOR DE MAPA A PANTALLA COMPLETA -->
    <!-- ================================================== -->
    <div id="modalVisorMapa" class="oculto gpu-accel" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000; z-index: 2147483647; display: none; flex-direction: column; overflow: hidden;">
        
        <!-- Barra superior minimalista adaptada -->
        <div style="display: flex; justify-content: space-between; align-items: center; background: #18191A; padding: 15px 20px; border-bottom: 1px solid var(--ngc-privacy-border); flex-shrink: 0; width: 100%; box-sizing: border-box;">
            <span style="color: #ffffff; font-weight: 600; font-size: 1rem; text-transform: uppercase;" id="mapaTitle">
                <i class="fa-solid fa-map-location-dot corp-accent-color"></i> Ubicación
            </span>
            <button onclick="cerrarMapaInterno()" class="corp-btn danger-btn" style="width: auto; padding: 8px 18px; margin: 0; border-radius: 20px; font-weight: bold;">
                <i class="fa-solid fa-arrow-left"></i> Volver
            </button>
        </div>

        <!-- Contenedor del Iframe de Google Maps -->
        <div style="position: relative; width: 100%; height: calc(100vh - 65px); background: #ffffff;">
            <!-- Spinner de carga -->
            <div id="visorLoaderMapa" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--ngc-neon); text-align: center; z-index: 1;">
                <i class="fa-solid fa-circle-notch fa-spin fa-3x"></i>
                <p style="margin-top: 15px; font-size: 0.9rem; font-weight: bold; color: #333;">Cargando Mapa...</p>
            </div>
            
            <!-- Iframe embebido -->
            <iframe id="iframeMapa" src="" style="width: 100%; height: 100%; border: none; display: block; position: relative; z-index: 2; opacity: 0; transition: opacity 0.3s ease;" onload="ocultarLoaderMapa()"></iframe>
        </div>
    </div>

    <!-- Librerías de Firebase Unificadas (Compatibles con toda la PWA) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <!-- Puente de Conexión a la Nube -->
    <script src="../firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
