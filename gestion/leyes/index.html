<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18191A">
    <title>Leyes Eléctricas | Villaser Gestión</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../global.css">

    <script>
        (function() {
            const temaGuardado = localStorage.getItem('temaVillaser') || 'system';
            const prefiereClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
            if (temaGuardado === 'light' || (temaGuardado === 'system' && prefiereClaro)) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    
    <style>
        /* Ajustes específicos para la Calculadora manteniendo el estilo Flat */
        .calc-input { 
            font-size: 1.2rem !important; 
            font-weight: bold; 
            text-align: center; 
            cursor: pointer; 
            caret-color: transparent; 
        }
        .modo-activo { 
            background: rgba(35, 116, 225, 0.1) !important; 
            color: var(--ngc-neon) !important; 
            border: 1px solid var(--ngc-neon) !important; 
        }
        .teclado-grid {
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            margin-top: 5px;
        }
    </style>
</head>
<body>

<!-- TOAST CORPORATIVO -->
<div id="toastNotificacion" class="toast-corp">
    <i id="toastIcon" class="fa-solid fa-circle-info toast-icon"></i>
    <div style="display: flex; flex-direction: column;">
        <span id="toastTitle" class="toast-title"></span>
        <span id="toastMessage" class="toast-msg"></span>
    </div>
</div>

<div class="layout-wrapper">
    <main class="container">
        
        <!-- BARRA DE NAVEGACIÓN -->
        <nav class="corp-top-nav">
            <button class="corp-btn-icon" onclick="window.location.href='../index.html'" aria-label="Volver al menú principal">
                <i class="fa-solid fa-arrow-left corp-accent-color"></i>
            </button>
            <div class="corp-nav-title">
                <i class="fa-solid fa-calculator corp-accent-color"></i> LEYES ELÉCTRICAS
            </div>
            <button class="corp-btn-icon danger" onclick="limpiarTodo()" title="Borrar Todo">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </nav>
        
        <section class="corp-card flex-column gap-15">
            
            <!-- SELECTOR DE LEYES -->
            <div class="row-group-stretch" style="margin-bottom: 5px;">
                <button class="corp-btn modo-activo" id="btn-pro" style="font-size: 0.8rem; padding: 10px;" onclick="cambiarModo('PRO')">
                    <i class="fa-solid fa-star"></i> Mágico
                </button>
                <button class="corp-btn" id="btn-ohm" style="font-size: 0.8rem; padding: 10px;" onclick="cambiarModo('OHM')">
                    Ley Ohm
                </button>
                <button class="corp-btn" id="btn-watt" style="font-size: 0.8rem; padding: 10px;" onclick="cambiarModo('WATT')">
                    Ley Watt
                </button>
            </div>
            
            <p id="instruccion-modo" style="text-align: center; color: var(--ngc-text-faded); font-size: 0.8rem; margin: 0;">
                Calculadora PRO: Ingresa <b>2</b> valores para calcular el resto.
            </p>

            <!-- PANTALLA DE LA CALCULADORA -->
            <div class="capture-zone" style="margin-top: 0;">
                
                <div class="row-group-stretch">
                    <div class="flex-1" id="cont-v">
                        <label style="color: var(--ngc-warning);"><i class="fa-solid fa-bolt"></i> Tensión (V)</label>
                        <input type="text" id="inp-v" class="corp-input calc-input" readonly onclick="setFoco('inp-v')" placeholder="Volts">
                    </div>
                    <div class="flex-1" id="cont-i">
                        <label style="color: var(--ngc-neon);"><i class="fa-solid fa-wave-square"></i> Corriente (A)</label>
                        <input type="text" id="inp-i" class="corp-input calc-input" readonly onclick="setFoco('inp-i')" placeholder="Amps">
                    </div>
                </div>
                
                <div class="row-group-stretch" style="margin-bottom: 0;" id="row-inferior">
                    <div class="flex-1" id="cont-r">
                        <label style="color: var(--success-green);"><i class="fa-solid fa-omega"></i> Resistencia (Ω)</label>
                        <input type="text" id="inp-r" class="corp-input calc-input" readonly onclick="setFoco('inp-r')" placeholder="Ohms">
                    </div>
                    <div class="flex-1" id="cont-p">
                        <label style="color: var(--error-red);"><i class="fa-solid fa-fire-flame-curved"></i> Potencia (W)</label>
                        <input type="text" id="inp-p" class="corp-input calc-input" readonly onclick="setFoco('inp-p')" placeholder="Watts">
                    </div>
                </div>

            </div>

            <!-- TECLADO NUMÉRICO DE ELECTRICISTA -->
            <div class="teclado-grid">
                <!-- Fila 1 -->
                <button class="corp-btn" onclick="tecla('7')">7</button>
                <button class="corp-btn" onclick="tecla('8')">8</button>
                <button class="corp-btn" onclick="tecla('9')">9</button>
                <button class="corp-btn danger-btn" onclick="borrar()"><i class="fa-solid fa-delete-left"></i></button>
                
                <!-- Fila 2 -->
                <button class="corp-btn" onclick="tecla('4')">4</button>
                <button class="corp-btn" onclick="tecla('5')">5</button>
                <button class="corp-btn" onclick="tecla('6')">6</button>
                <button class="corp-btn danger-btn" onclick="limpiarTodo()">C</button>
                
                <!-- Fila 3 -->
                <button class="corp-btn" onclick="tecla('1')">1</button>
                <button class="corp-btn" onclick="tecla('2')">2</button>
                <button class="corp-btn" onclick="tecla('3')">3</button>
                <button class="corp-btn success-btn" style="grid-row: span 2; font-size: 1.5rem;" onclick="calcular()">=</button>
                
                <!-- Fila 4 -->
                <button class="corp-btn" style="grid-column: span 2;" onclick="tecla('0')">0</button>
                <button class="corp-btn" onclick="tecla('.')">.</button>
            </div>

        </section>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
